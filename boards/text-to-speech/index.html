<!doctype html>
<html><head><meta charset="utf-8"><title>Text to Speech</title><link rel="stylesheet" href="board-base.css"><link rel="stylesheet" href="app.css"></head>
<body><main id="app">
<header class="page-header"><div><h1 data-i18n="title"></h1><p data-i18n="notice"></p></div><p id="status" class="pill" role="status"></p></header>
<section class="panel">
<progress id="progress" hidden></progress>
<div class="actions"><button id="install" class="primary" data-i18n="install"></button><button id="cancel" hidden data-i18n="cancel"></button><button id="delete" hidden data-i18n="delete"></button></div>
</section>
<section class="panel"><h2 data-i18n="playback"></h2>
<label class="volume"><span data-i18n="volume"></span><span class="volume-row"><input id="volume" type="range" min="0.25" max="4" step="0.05" value="1"><output id="volume-value">100%</output></span></label>
<p class="hint" data-i18n="volumeHint"></p>
</section>
<section class="panel"><h2 data-i18n="test"></h2>
<label><span data-i18n="text"></span><textarea id="text" rows="5"></textarea></label>
<div class="actions"><button id="english" data-i18n="english"></button><button id="ukrainian" data-i18n="ukrainian"></button></div>
<div class="form-grid"><label><span data-i18n="language"></span><select id="language"></select></label><label><span data-i18n="voice"></span><select id="voice"></select></label><label><span data-i18n="speed"></span><input id="speed" type="number" min="0.5" max="2" step="0.1" value="1"></label></div>
<div class="actions"><button id="speak" class="primary" data-i18n="speak"></button><button id="stop" data-i18n="stop"></button></div>
</section>
</main>
<script src="i18n.js"></script><script src="app.js"></script></body></html>
