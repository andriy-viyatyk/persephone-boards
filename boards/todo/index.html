<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title data-i18n="todo.documentTitle">Todo Board</title>
  <!-- Persephone injects the --p-* palette, boot context, and the persephone bridge
       shim into <head> BEFORE these links. board-base.css first, then our own styles. -->
  <link rel="stylesheet" href="./board-base.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- ── Main list view (persephone.view === "main") ─────────────────────── -->
  <div id="main-root" class="root">
    <header class="topbar">
      <div id="list-switch" class="list-switch">
        <button id="list-switch-btn" data-i18n-title="todo.list.switch.title" class="list-switch-btn" type="button" title="Switch list" data-name="list-switch">
          <span class="list-switch-label" data-i18n="todo.list.switch.label">List:</span>
          <span id="list-name" class="list-switch-name" data-i18n="todo.list.all">All</span>
          <span class="list-switch-caret">▾</span>
        </button>
        <!-- list picker (.tag-menu) is appended here by openListSwitch -->
      </div>
      <span id="file-name" class="file-name" data-i18n="todo.documentTitle">Todo Board</span>
      <div class="search-wrap">
        <input id="search" data-i18n-placeholder="todo.search.placeholder" type="text" placeholder="Search…" autocomplete="off" data-name="search" />
        <button id="search-clear" data-i18n-title="todo.search.clear" class="icon-btn" title="Clear search" hidden>✕</button>
      </div>
    </header>

    <div class="quick-add">
      <input id="quick-add-input" data-i18n-placeholder="todo.item.add.placeholder" type="text" placeholder="Add an item…" autocomplete="off" data-name="quick-add-input" />
      <button id="quick-add-btn" data-i18n-title="todo.item.add.title" class="icon-btn add" title="Add item">＋</button>
    </div>

    <div id="todo-list" class="todo-list"></div>
    <div id="main-empty" class="empty" hidden></div>
  </div>

  <!-- ── Lists & Tags secondary view (persephone.view === "lists") ───────── -->
  <div id="lists-root" class="root" hidden>
    <div class="new-row" data-name="add-list">
      <input id="new-list" data-i18n-placeholder="todo.list.add.placeholder" type="text" placeholder="New list…" autocomplete="off" />
      <button id="add-list" data-i18n-title="todo.list.add.title" class="icon-btn add" title="Add list">＋</button>
    </div>
    <div class="section-title" data-i18n="todo.section.lists">Lists</div>
    <div id="lists-body" data-name="lists"></div>

    <div class="section-title" data-i18n="todo.section.tags">Tags</div>
    <div id="tags-body" data-name="tags"></div>

    <div class="new-row bottom" data-name="add-tag">
      <input id="new-tag" data-i18n-placeholder="todo.tag.add.placeholder" type="text" placeholder="New tag…" autocomplete="off" />
      <button id="add-tag" data-i18n-title="todo.tag.add.title" class="icon-btn add" title="Add tag">＋</button>
    </div>
  </div>

  <script src="./i18n.js"></script>
    <script src="./app.js"></script>
</body>
</html>
