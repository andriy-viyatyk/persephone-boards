<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="board.title">Wake Word</title>
  <link rel="stylesheet" href="./board-base.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main id="app">
    <header class="page-header"><div><h1 data-i18n="board.title">Wake Word</h1><p data-i18n="board.subtitle"></p></div><span id="status" class="pill" data-i18n="status.ready"></span></header>
    <p id="error" role="alert" hidden></p>
    <div class="columns">
      <div class="main-column">
        <section class="panel enrollment">
          <h2 data-i18n="enroll.title"></h2>
          <div class="form-grid">
            <label><span data-i18n="field.kind"></span><select id="kind"><option value="wake" data-i18n="kind.wake"></option><option value="stop" data-i18n="kind.stop"></option></select></label>
            <label><span data-i18n="field.phrase"></span><input id="phrase" maxlength="128" value="agent-wake" autocomplete="off"></label>
            <label><span data-i18n="field.person"></span><input id="person" maxlength="128" autocomplete="off" placeholder="Me"></label>
            <label><span data-i18n="field.microphone"></span><select id="microphone"></select></label>
            <label><span data-i18n="field.echoCancel"></span><select id="echo-cancel"><option value="true" data-i18n="echo.on"></option><option value="false" data-i18n="echo.off"></option></select></label>
            <div class="form-button"><button id="refresh-devices" data-i18n="microphone.refresh"></button></div>
          </div>
          <div class="actions"><button id="record" class="primary" data-i18n="enroll.record"></button><span id="recording" class="muted" data-i18n="enroll.prompt"></span></div>
          <p class="hint" data-i18n="enroll.hint"></p>
        </section>
        <section class="panel samples-panel">
          <div class="section-heading"><h2 data-i18n="samples.title"></h2><button id="refresh" data-i18n="common.refresh"></button></div>
          <div id="samples" class="sample-tree"></div>
        </section>
      </div>
      <section class="panel live-panel">
        <h2 data-i18n="live.title"></h2>
        <p class="muted" data-i18n="live.hint"></p>
        <label class="threshold"><span data-i18n="live.threshold"></span><input id="threshold" type="number" min="0" max="1" step="0.01" value="0.85"></label>
        <div class="actions"><button id="listen" class="primary" data-i18n="live.start"></button><span id="live-score" class="muted"></span></div>
        <ol id="events" class="events" aria-live="polite"></ol>
      </section>
    </div>
    <footer data-i18n="privacy.note"></footer>
  </main>
  <dialog id="review-dialog" aria-labelledby="review-title">
    <h2 id="review-title" data-i18n="review.title"></h2>
    <p data-i18n="review.waveform"></p>
    <div id="review-visual" class="review-visual">
      <canvas id="review-waveform" aria-hidden="true"></canvas>
      <canvas id="review-spectrogram" aria-hidden="true"></canvas>
      <button type="button" id="review-start" class="review-handle" role="slider"></button>
      <button type="button" id="review-end" class="review-handle" role="slider"></button>
    </div>
    <div id="review-times" class="review-times" aria-hidden="true"></div>
    <p data-i18n="review.spectrogram"></p>
    <p id="review-length"></p><p id="review-error" role="alert"></p>
    <div class="actions"><button id="review-play-selection" type="button" data-i18n="review.playSelection"></button><button id="review-play-all" type="button" data-i18n="review.playAll"></button><button id="review-add" class="primary" type="button" data-i18n="review.add"></button><button id="review-cancel" type="button" data-i18n="review.cancel"></button></div>
  </dialog>
  <script src="./i18n.js"></script><script src="./spectrogram.js"></script><script src="./review.js"></script><script src="./app.js"></script>
</body>
</html>
