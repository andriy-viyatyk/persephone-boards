<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Agent Log Viewer</title>
    <link rel="stylesheet" href="./board-base.css" />
    <link rel="stylesheet" href="./styles.css" />
</head>
<body>
    <div id="bar" class="p-toolbar">
        <button id="back" class="p-btn icon ghost" title="Back to the session list (Backspace)" hidden>
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="source" title="">No source</span>
        <span class="p-spacer"></span>
        <button id="openFiles" class="p-btn" title="Open one or more session log files">Files…</button>
        <button id="openFolder" class="p-btn" title="Open a folder of session logs">Folder…</button>
        <button id="presetClaude" class="p-btn" title="All Claude Code sessions">Claude Code</button>
        <button id="presetCodex" class="p-btn" title="All Codex sessions">Codex</button>
        <select id="recent" class="p-select" title="Recent sources"><option value="">Recent…</option></select>
        <button id="reload" class="p-btn icon ghost" title="Reload from disk" disabled>
            <svg viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/></svg>
        </button>
    </div>

    <!-- Multi-session view: several files or a folder -->
    <section id="listView" hidden>
        <div id="listTools">
            <input id="filter" class="p-input" type="search" placeholder="Filter by title or project…" />
            <select id="agentFilter" class="p-select" title="Agent">
                <option value="">All agents</option>
                <option value="claude">Claude Code</option>
                <option value="codex">Codex</option>
            </select>
            <select id="groupBy" class="p-select" title="Group rows">
                <option value="">No grouping</option>
                <option value="project">By project</option>
                <option value="day">By day</option>
            </select>
            <label class="chk" title="Include subagent sessions"><input id="showSub" type="checkbox" /> Subagents</label>
            <span class="p-spacer"></span>
            <input id="contentSearch" class="p-input" type="search" placeholder="Search prompts and answers…" title="Scans the files (Enter)" />
        </div>
        <div id="summary">
            <div id="totals"></div>
            <svg id="chart" preserveAspectRatio="none"></svg>
        </div>
        <div id="tableWrap">
            <table id="table"><thead></thead><tbody></tbody></table>
        </div>
    </section>

    <!-- Single-session view -->
    <section id="sessionView" hidden>
        <div id="sessHeader">
            <div id="sessTitle"></div>
            <div id="sessMeta"></div>
            <div id="sessTools">
                <label class="chk"><input type="checkbox" data-filter="user" checked /> Prompts</label>
                <label class="chk"><input type="checkbox" data-filter="assistant" checked /> Answers</label>
                <label class="chk"><input type="checkbox" data-filter="thinking" checked /> Thinking</label>
                <label class="chk"><input type="checkbox" data-filter="tool" checked /> Tool calls</label>
                <label class="chk"><input type="checkbox" data-filter="meta" /> System</label>
                <label class="chk"><input type="checkbox" id="errorsOnly" /> Errors only</label>
                <span class="p-spacer"></span>
                <button id="expandAll" class="p-btn" title="Expand all tool calls">Expand</button>
                <button id="collapseAll" class="p-btn" title="Collapse all">Collapse</button>
                <input id="find" class="p-input" type="search" placeholder="Find in session…" title="Enter: search, then n / p" />
                <span id="findInfo"></span>
                <button id="findPrev" class="p-btn icon ghost" title="Previous match (p)"><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
                <button id="findNext" class="p-btn icon ghost" title="Next match (n)"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
            </div>
        </div>
        <div id="sessBody">
            <nav id="outline"></nav>
            <div id="transcript"></div>
        </div>
    </section>

    <div id="state" class="show"></div>

    <script src="./lib/marked.umd.js"></script>
    <script src="./lib/purify.min.js"></script>
    <script src="./app.js"></script>
</body>
</html>
