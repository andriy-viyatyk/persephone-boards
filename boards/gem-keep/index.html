<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Gem Keep</title>
  <link rel="stylesheet" href="./board-base.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="stage">
    <canvas id="view" data-name="game-view"></canvas>
    <div id="floats" aria-hidden="true"></div>

    <header id="hud" class="hud" hidden>
      <div class="hud-group">
        <span class="stat gold" data-name="gold" data-i18n-title="hud.gold"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="#ffc94a" stroke="#a8761a" stroke-width="1.2"/><path d="M8 4.5v7M6 6.2c0-.9 4-.9 4 0s-4 .8-4 1.8 4 .9 4 0" stroke="#a8761a" stroke-width="1.1" fill="none" stroke-linecap="round"/></svg><b id="gold">0</b></span>
        <span class="stat gems" data-name="gems" data-i18n-title="hud.gems"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l5 5-5 8-5-8z" fill="#40ffd0" stroke="#108a70" stroke-width="1"/><path d="M3 6.5h10M8 1.5v13" stroke="#108a70" stroke-width=".7"/></svg><b id="gems">0</b><small id="gems-out" class="gems-out"></small></span>
        <span class="stat wave" data-name="wave"><span id="wave"></span><small id="difficulty-badge" class="difficulty-badge"></small></span>
        <span class="stat mana" data-name="mana" data-i18n-title="hud.mana"><span class="mana-bar"><span id="mana-fill"></span></span></span>
      </div>
      <div class="hud-group">
        <button id="mute" class="hud-button" type="button" data-name="mute" data-i18n-title="hud.mute" aria-pressed="false"><svg class="icon-sound" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5h2.2L7.5 2.2v9.6L4.2 9H2z"/><path d="M9.3 4.6a3.2 3.2 0 0 1 0 4.8M10.8 3a5.4 5.4 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg><svg class="icon-muted" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 5h2.2L7.5 2.2v9.6L4.2 9H2z"/><path d="M9.5 5l3.2 4M12.7 5L9.5 9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>
        <button id="speed" class="hud-button" type="button" data-name="speed" data-i18n-title="hud.speed">1×</button>
        <button id="pause" class="hud-button" type="button" data-name="pause" data-i18n-title="hud.pause"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="3" y="2.5" width="2.8" height="9" rx=".6"/><rect x="8.2" y="2.5" width="2.8" height="9" rx=".6"/></svg></button>
        <button id="restart" class="hud-button" type="button" data-name="restart" data-i18n-title="hud.restart"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M11.5 7a4.5 4.5 0 1 1-1.3-3.2"/><path d="M10.6 1.6v2.6H8"/></svg></button>
        <button id="levels" class="hud-button" type="button" data-name="levels" data-i18n-title="hud.levels"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="4" height="4" rx=".8"/><rect x="8" y="2" width="4" height="4" rx=".8"/><rect x="2" y="8" width="4" height="4" rx=".8"/><rect x="8" y="8" width="4" height="4" rx=".8"/></svg></button>
      </div>
    </header>

    <footer id="actions" class="actions" hidden>
      <button id="wave-button" class="action wave-action" type="button" data-name="start-wave"></button>
      <button id="meteor-button" class="action spell-action" type="button" data-name="meteor"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="#ff7a30"/><path d="M2 2l5.5 5.5M4.5 1.5l4 4M1.5 4.5l4 4" stroke="#ffb060" stroke-width="1.4" stroke-linecap="round"/></svg><span data-i18n="spell.meteor"></span><small id="meteor-cost"></small></button>
    </footer>
    <p id="controls-hint" class="controls-hint" data-i18n="hint.controls" hidden></p>
    <p id="target-hint" class="target-hint" data-i18n="hint.meteor" hidden></p>

    <div id="build-panel" class="popup" data-name="build-panel" hidden></div>
    <div id="tower-panel" class="popup" data-name="tower-panel" hidden></div>

    <section id="menu" class="screen" data-name="level-menu">
      <div class="menu-card">
        <h1 class="title" data-i18n="game.title"></h1>
        <p class="subtitle" data-i18n="game.subtitle"></p>
        <div class="difficulty-row">
          <span class="difficulty-label" data-i18n="difficulty.label"></span>
          <div id="difficulty" class="difficulty" role="group" data-name="difficulty"></div>
        </div>
        <div id="level-list" class="level-list"></div>
        <p id="menu-error" class="error" hidden></p>
      </div>
    </section>

    <section id="result" class="screen" data-name="result" hidden>
      <div class="menu-card result-card">
        <h1 id="result-title" class="title"></h1>
        <div id="result-stars" class="stars big"></div>
        <p id="result-text" class="subtitle"></p>
        <div class="result-buttons">
          <button id="result-retry" class="menu-button" type="button" data-i18n="result.retry"></button>
          <button id="result-next" class="menu-button primary" type="button" data-i18n="result.next"></button>
          <button id="result-levels" class="menu-button" type="button" data-i18n="result.levels"></button>
        </div>
      </div>
    </section>

    <div id="paused" class="paused-banner" data-i18n="hud.paused" hidden></div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
