<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="board.title">Speech to Text</title>
  <link rel="stylesheet" href="./board-base.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main id="app">
    <header class="page-header">
      <div><h1 data-i18n="board.title">Speech to Text</h1><p data-i18n="board.subtitle"></p></div>
      <span id="engine-state" class="state-pill" data-i18n="engine.notReady"></span>
    </header>
    <p id="error" role="alert" hidden></p>
    <details id="setup-panel" class="panel disclosure">
      <summary><span data-i18n="models.title"></span><span id="setup-summary" class="muted"></span></summary>
      <div class="disclosure-body">
        <div id="runtime-row" class="asset-row"></div>
        <div id="model-list"></div>
        <p id="active-model" class="muted"></p>
        <label id="gpu-row" class="gpu-row" hidden>
          <span data-i18n="gpu.label"></span>
          <select id="gpu-device"></select>
        </label>
        <p id="gpu-hint" class="muted" data-i18n="gpu.hint"></p>
      </div>
    </details>
    <section class="test-block" aria-label="Microphone test">
      <label class="microphone"><span data-i18n="recorder.microphone"></span><select id="microphones"></select></label>
      <fieldset id="mode-switch" class="mode-switch">
        <legend data-i18n="test.modeLabel"></legend>
        <label><input type="radio" name="test-mode" value="record" checked><span data-i18n="test.recordThenType"></span></label>
        <label><input type="radio" name="test-mode" value="live"><span data-i18n="test.liveTyping"></span></label>
      </fieldset>
      <div class="level-track" aria-label="Microphone level"><div id="level"></div></div>
      <button id="test-button" class="primary test-button" disabled>
        <span class="mic-icon" aria-hidden="true"></span>
        <span id="test-button-label" data-i18n="test.start"></span>
      </button>
      <p id="recording-status" class="muted" data-i18n="recorder.idle"></p>
      <p id="not-ready-hint" class="muted" data-i18n="engine.notReady" hidden></p>
      <div id="transcript" aria-live="polite"><span id="committed-text"></span><span id="draft-text" class="draft-text"></span></div>
      <p id="result-meta" class="muted"></p>
      <p class="privacy-note" data-i18n="privacy.local"></p>
    </section>
    <details id="audio-debug-panel" class="panel disclosure">
      <summary><span data-i18n="debug.title"></span><span id="debug-summary" class="muted" data-i18n="debug.idle"></span></summary>
      <div class="disclosure-body debug-body">
        <p data-i18n="debug.explain"></p>
        <p class="muted" data-i18n="debug.privacy"></p>
        <div class="debug-controls">
          <button id="debug-record" class="primary" type="button" data-i18n="debug.record"></button>
          <button id="debug-stop" type="button" data-i18n="debug.stop" disabled></button>
          <label class="debug-request"><span data-i18n="debug.select"></span><select id="debug-requests"><option value="" data-i18n="debug.noRequests"></option></select></label>
          <button id="debug-attach" type="button" data-i18n="debug.attach" disabled></button>
          <button id="debug-clear" type="button" data-i18n="debug.clear"></button>
          <button id="debug-play" type="button" data-i18n="debug.play" disabled></button>
          <button id="debug-play-stop" type="button" data-i18n="debug.playStop" disabled></button>
        </div>
        <p id="debug-status" role="status" aria-live="polite" class="muted" data-i18n="debug.disconnected"></p>
        <p id="debug-duration" class="muted">0:00 / 0:00</p>
        <canvas id="debug-waveform" height="54" role="img" data-i18n-aria-label="debug.waveformLabel"></canvas>
        <canvas id="debug-spectrogram" height="180" role="img" data-i18n-aria-label="debug.spectrogramLabel"></canvas>
        <label class="debug-seek"><span data-i18n="debug.seek"></span><input id="debug-seek" type="range" min="0" max="1000" value="0" step="1" disabled></label>
      </div>
    </details>
    <details id="license-panel" class="panel disclosure">
      <summary><span data-i18n="licenses.title"></span></summary>
      <div class="disclosure-body license-body">
        <p><span data-i18n="licenses.model"></span> <a href="https://github.com/openai/whisper/blob/main/LICENSE" target="_blank" rel="noreferrer">MIT</a>.</p>
        <p data-i18n="licenses.runtime"></p>
        <div id="runtime-licenses" class="license-list"></div>
      </div>
    </details>
  </main>
  <script src="./i18n.js"></script>
  <script src="./audio-debug.js"></script>
  <script src="./app.js"></script>
</body>
</html>
