<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke-width="1.1">
  <!-- Fixed colors rather than currentColor, so the icon reads on both light and dark
       themes; currentColor resolved to near black in the page tab. This matches the other
       boards, which all use explicit brand colors. The hues come from the graph palette
       itself: #00bfff is the default node color and #b07ce8 the special node color. -->
  <g stroke="#7A93A8">
    <line x1="8" y1="3.2" x2="3.4" y2="8.2" />
    <line x1="8" y1="3.2" x2="12.6" y2="8.2" />
    <line x1="3.4" y1="8.2" x2="6.2" y2="13" />
    <line x1="12.6" y1="8.2" x2="6.2" y2="13" />
  </g>
  <circle cx="8" cy="3.2" r="2.1" fill="#29B6F6" />
  <circle cx="3.4" cy="8.2" r="1.6" fill="#1BA1E2" />
  <circle cx="12.6" cy="8.2" r="1.6" fill="#1BA1E2" />
  <circle cx="6.2" cy="13" r="1.3" fill="#B07CE8" />
</svg>
