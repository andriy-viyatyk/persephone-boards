<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fixed colours (not currentColor), like the other boards' icons, so it reads on light and dark themes. -->
  <defs>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B388FF" />
      <stop offset="1" stop-color="#F06292" />
    </linearGradient>
  </defs>
  <!-- Beamed eighth notes -->
  <path d="M10 22.5V8.2l13-3.2v14.5" stroke="url(#note)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M10 8.2l13-3.2v3.4l-13 3.2z" fill="url(#note)" />
  <ellipse cx="7.2" cy="23" rx="3.4" ry="2.6" transform="rotate(-20 7.2 23)" fill="#B388FF" />
  <ellipse cx="20.2" cy="20" rx="3.4" ry="2.6" transform="rotate(-20 20.2 20)" fill="#F06292" />
  <!-- Equalizer bars -->
  <rect x="24.5" y="24" width="2" height="5" rx="1" fill="#4DD0E1" />
  <rect x="27.5" y="20.5" width="2" height="8.5" rx="1" fill="#4DD0E1" opacity="0.8" />
</svg>
