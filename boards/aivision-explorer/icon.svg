<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="AiVision Explorer">
    <!-- The board's tab / tile / sidebar icon: the same blue "AV" mark the board shows in
         its own toolbar. Colours are literal because a standalone SVG cannot read
         Persephone's live palette; they match the accent and accent-text tokens. -->
    <rect width="32" height="32" rx="6" fill="#0078d4" />
    <text x="16" y="17" fill="#ffffff" text-anchor="middle" dominant-baseline="central"
          font-family="Segoe UI, system-ui, -apple-system, sans-serif"
          font-size="15" font-weight="800" letter-spacing="-1">AV</text>
</svg>
