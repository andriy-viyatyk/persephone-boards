<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Wake Word: a listening microphone with sound waves on both sides. Fixed colours (not
       currentColor), like the other boards' icons, so it reads on light and dark themes. -->
  <defs>
    <linearGradient id="mic" x1="8" y1="3" x2="24" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#8B7CF6"/>
    </linearGradient>
  </defs>
  <rect x="12" y="3.5" width="8" height="14" rx="4" fill="url(#mic)"/>
  <path d="M8.5 14.5a7.5 7.5 0 0 0 15 0M16 22v4.5M12 27h8" stroke="url(#mic)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M5.6 8.5q-2.4 4.5 0 9M26.4 8.5q2.4 4.5 0 9" stroke="#5EEAD4" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M2.8 6.5q-3.2 6.5 0 13M29.2 6.5q3.2 6.5 0 13" stroke="#8B7CF6" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.8"/>
</svg>
