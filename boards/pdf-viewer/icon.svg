        fill-opacity="0.12" stroke="#E5252A" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M14 3v5h5" stroke="#E5252A" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- font-size is tuned so "PDF" clears the page outline's stroke on both sides at 24 units. -->
