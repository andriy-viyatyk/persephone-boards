<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Gem Keep: a stone keep with battlements guarding a faceted gem. Fixed colours (not currentColor),
       like the other boards' icons, so it reads on light and dark themes. -->
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9B4AA" />
      <stop offset="1" stop-color="#7E7A72" />
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8FFF0" />
      <stop offset="0.5" stop-color="#40FFD0" />
      <stop offset="1" stop-color="#0E9C82" />
    </linearGradient>
  </defs>
  <!-- Keep: body with three merlons on top and a dark door -->
  <path d="M5 29V9h3.6V5.5h3.6V9h3.6V5.5h3.6V9h3.6V5.5H27V29z" fill="url(#stone)" stroke="#5E5A54" stroke-width="1" stroke-linejoin="round" />
  <path d="M5 13h22" stroke="#5E5A54" stroke-width="0.8" opacity="0.6" />
  <!-- Gem in front of the door -->
  <path d="M16 13.5l7 5.2-7 10.8-7-10.8z" fill="url(#gem)" stroke="#0B6E5C" stroke-width="1" stroke-linejoin="round" />
  <path d="M9 18.7h14M16 13.5l-2.6 5.2L16 29.5l2.6-10.8z" fill="none" stroke="#0B6E5C" stroke-width="0.7" stroke-linejoin="round" opacity="0.8" />
  <path d="M12.4 17.3l2-2.3" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.85" />
  <!-- Gold sparkle -->
  <path d="M25.5 2.5l0.7 1.6 1.6 0.7-1.6 0.7-0.7 1.6-0.7-1.6-1.6-0.7 1.6-0.7z" fill="#FFC94A" />
</svg>
