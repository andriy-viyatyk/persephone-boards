<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Agent Chat: a neon ring around "AI", one cyan-to-magenta gradient, with a soft glow. -->
  <defs>
    <linearGradient id="neon" x1="12" y1="12" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ee6f5"/>
      <stop offset="0.5" stop-color="#7a7cff"/>
      <stop offset="1" stop-color="#e044f0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="url(#neon)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="url(#neon)" stroke-width="7"/>
    <path fill-rule="evenodd" d="M25 72 L37.6 28 L48.4 28 L61 72 L52.2 72 L49.6 62.6 L36.4 62.6 L33.8 72 Z M38.6 55 L47.4 55 L43 39.6 Z"/>
    <rect x="67" y="28" width="9" height="44"/>
  </g>
</svg>
