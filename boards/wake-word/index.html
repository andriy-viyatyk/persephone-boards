<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="board.title">Wake Word</title>
  <link rel="stylesheet" href="./board-base.css">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <main id="app">
    <header class="page-header"><div><h1 data-i18n="board.title">Wake Word</h1><p data-i18n="board.subtitle"></p></div><span id="status" class="pill" data-i18n="status.ready"></span></header>
    <p id="error" role="alert" hidden></p>
    <section class="panel enrollment">
      <h2 data-i18n="enroll.title"></h2>
      <div class="form-grid">
        <label><span data-i18n="field.phrase"></span><input id="phrase" maxlength="128" autocomplete="off"></label>
        <label><span data-i18n="field.person"></span><input id="person" maxlength="128" autocomplete="off"></label>
        <label><span data-i18n="field.kind"></span><select id="kind"><option value="wake" data-i18n="kind.wake"></option><option value="stop" data-i18n="kind.stop"></option></select></label>
        <label><span data-i18n="field.microphone"></span><select id="microphone"></select></label>
      </div>
      <div class="actions"><button id="record" class="primary" data-i18n="enroll.record"></button><span id="recording" class="muted" data-i18n="enroll.prompt"></span></div>
      <p class="hint" data-i18n="enroll.hint"></p>
    </section>
    <section class="panel">
      <div class="section-heading"><h2 data-i18n="samples.title"></h2><button id="refresh" data-i18n="common.refresh"></button></div>
      <div id="samples" class="sample-list"></div>
      <div class="delete-row"><label><span data-i18n="delete.person"></span><input id="delete-person"></label><button id="delete-person-button" data-i18n="delete.run"></button></div>
      <div class="delete-row"><label><span data-i18n="delete.phrase"></span><input id="delete-phrase"></label><select id="delete-kind"><option value="wake" data-i18n="kind.wake"></option><option value="stop" data-i18n="kind.stop"></option></select><button id="delete-phrase-button" data-i18n="delete.run"></button></div>
    </section>
    <section class="panel live-panel">
      <div class="section-heading"><div><h2 data-i18n="live.title"></h2><p class="muted" data-i18n="live.hint"></p></div><label class="threshold"><span data-i18n="live.threshold"></span><input id="threshold" type="number" min="0" max="1" step="0.01" value="0.85"></label></div>
      <div class="actions"><button id="listen" class="primary" data-i18n="live.start"></button><span id="live-score" class="muted"></span></div>
      <ol id="events" class="events" aria-live="polite"></ol>
    </section>
    <footer data-i18n="privacy.note"></footer>
  </main>
  <script src="./i18n.js"></script><script src="./app.js"></script>
</body>
</html>
