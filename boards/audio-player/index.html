<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="document.title">Audio Player</title>
  <link rel="stylesheet" href="board-base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-mode="full">
  <main class="player-shell">
    <section class="content">
      <nav id="catalog-nav" class="catalog-nav" data-name="catalog-panel" data-i18n-aria-label="catalog.filter" hidden><div class="catalog-nav-filter"><svg class="catalog-nav-filter-icon" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="3.8"/><path d="M8.8 8.8l3 3"/></svg><input id="catalog-nav-filter" type="text" spellcheck="false" autocomplete="off" data-name="catalog-panel-filter" data-i18n-placeholder="catalog.panelFilter" data-i18n-aria-label="catalog.panelFilter"><button id="catalog-nav-filter-clear" type="button" class="catalog-nav-filter-clear" data-i18n-title="catalog.panelFilterClear" data-i18n-aria-label="catalog.panelFilterClear" hidden><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg></button></div><div id="catalog-nav-list"></div><button id="catalog-playing" type="button" class="catalog-playing" data-name="catalog-playing-list" hidden><svg class="catalog-playing-icon" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="1.5" y="6" width="2" height="6" rx=".6"/><rect x="5" y="3" width="2" height="9" rx=".6"/><rect x="8.5" y="5" width="2" height="7" rx=".6"/><rect x="12" y="8" width="1.5" height="4" rx=".6"/></svg><span class="catalog-playing-text"><small data-i18n="catalog.playingList"></small><span id="catalog-playing-label"></span></span><span id="catalog-playing-count" class="catalog-nav-count"></span></button></nav>
      <section class="stage">
        <div id="visualizer" class="visualizer">
          <canvas id="canvas" aria-hidden="true"></canvas>
          <div id="metadata" class="metadata" hidden><img id="track-cover" alt="" hidden><h1 id="now-playing-title"></h1><p id="now-playing-artist"></p></div>
          <div id="track-chip" class="track-chip" data-name="track-chip" hidden><span id="track-chip-title" class="track-chip-title"></span><span id="track-chip-artist" class="track-chip-artist"></span><button id="add-current" class="effect-button chip-catalog-button" type="button" data-state="add" data-name="add-current" hidden><svg class="icon-add" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><line x1="7" y1="2" x2="7" y2="12"/><line x1="2" y1="7" x2="12" y2="7"/></svg><svg class="icon-edit" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.6 2.2l2.2 2.2-7 7H2.6V9.2z"/><path d="M8.2 3.6l2.2 2.2"/></svg></button></div>
          <button id="catalog-toggle" class="effect-button catalog-toggle" type="button" aria-pressed="false" aria-controls="catalog-nav" data-name="catalog-toggle" data-i18n-title="mode.catalog" data-i18n-aria-label="mode.catalog"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><line x1="1.5" y1="3" x2="12.5" y2="3"/><line x1="1.5" y1="7" x2="8" y2="7"/><line x1="1.5" y1="11" x2="7" y2="11"/><circle cx="10.5" cy="11" r="1.5"/><line x1="12" y1="11" x2="12" y2="5.5"/></svg></button>
          <div class="effect-picker" role="group" data-i18n-aria-label="visualizer.choose">
            <button class="effect-button" data-effect="bars" type="button" data-i18n-title="visualizer.bars" data-i18n-aria-label="visualizer.bars"><svg viewBox="0 0 14 12" fill="currentColor" aria-hidden="true"><rect x="0" y="5" width="2" height="7" rx="0.5"/><rect x="3" y="2" width="2" height="10" rx="0.5"/><rect x="6" y="0" width="2" height="12" rx="0.5"/><rect x="9" y="3" width="2" height="9" rx="0.5"/><rect x="12" y="6" width="2" height="6" rx="0.5"/></svg></button>
            <button class="effect-button" data-effect="circular" type="button" data-i18n-title="visualizer.circular" data-i18n-aria-label="visualizer.circular"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="7" cy="7" r="2.5"/><line x1="7" y1="4.5" x2="7" y2="1"/><line x1="7" y1="9.5" x2="7" y2="13"/><line x1="4.5" y1="7" x2="1" y2="7"/><line x1="9.5" y1="7" x2="13" y2="7"/><line x1="5.3" y1="5.3" x2="2.9" y2="2.9"/><line x1="8.7" y1="8.7" x2="11.1" y2="11.1"/><line x1="8.7" y1="5.3" x2="11.1" y2="2.9"/><line x1="5.3" y1="8.7" x2="2.9" y2="11.1"/></svg></button>
            <button class="effect-button" data-effect="none" type="button" data-i18n-title="visualizer.off" data-i18n-aria-label="visualizer.off"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="7" cy="7" r="5.5"/><line x1="3.1" y1="3.1" x2="10.9" y2="10.9"/></svg></button>
          </div>
          <section id="catalog-overlay" class="catalog-overlay" data-name="catalog-list" hidden>
            <header class="catalog-overlay-header"><strong id="catalog-overlay-title" class="catalog-overlay-title"></strong><button id="catalog-overlay-close" class="effect-button" type="button" data-name="catalog-list-close" data-i18n-title="control.close" data-i18n-aria-label="control.close"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="3" x2="11" y2="11"/><line x1="11" y1="3" x2="3" y2="11"/></svg></button></header>
            <p id="catalog-empty" class="catalog-empty" data-i18n="catalog.empty">Open or create a catalog to browse tracks.</p>
            <ol id="catalog-list"></ol>
          </section>
        </div>
        <div class="transport">
          <button id="shuffle" class="effect-button transport-toggle" type="button" aria-pressed="false" data-name="shuffle" data-i18n-title="control.shuffle" data-i18n-aria-label="control.shuffle"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 4h2.2c1.6 0 2.4 1.2 3.3 3s1.7 3 3.3 3H13"/><path d="M1 10h2.2c1.6 0 2.4-1.2 3.3-3s1.7-3 3.3-3H13"/><path d="M11 2l2 2-2 2"/><path d="M11 8l2 2-2 2"/></svg></button>
          <button id="previous" class="transport-button" type="button" data-name="previous-track" data-i18n-aria-label="control.previous"><svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="2" y="2.5" width="1.6" height="9" rx=".5"/><path d="M12 2.8v8.4a.5.5 0 0 1-.78.42L5 7.42a.5.5 0 0 1 0-.84l6.22-4.2A.5.5 0 0 1 12 2.8z"/></svg></button>
          <button id="play" class="transport-button play-button" type="button" data-name="play-pause" data-state="paused" data-i18n-title="control.play" data-i18n-aria-label="control.play"><svg class="icon-play" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M4 2.6v8.8a.6.6 0 0 0 .9.52l7.2-4.4a.6.6 0 0 0 0-1.04L4.9 2.08A.6.6 0 0 0 4 2.6z"/></svg><svg class="icon-pause" viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="3.3" y="2.5" width="2.6" height="9" rx=".6"/><rect x="8.1" y="2.5" width="2.6" height="9" rx=".6"/></svg></button>
          <button id="next" class="transport-button" type="button" data-name="next-track" data-i18n-aria-label="control.next"><svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><rect x="10.4" y="2.5" width="1.6" height="9" rx=".5"/><path d="M2 2.8v8.4a.5.5 0 0 0 .78.42L9 7.42a.5.5 0 0 0 0-.84L2.78 2.38A.5.5 0 0 0 2 2.8z"/></svg></button>
          <button id="repeat" class="effect-button transport-toggle" type="button" data-repeat="off" data-name="repeat" data-i18n-title="repeat.off" data-i18n-aria-label="repeat.off"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 7V5.5A2.5 2.5 0 0 1 4.5 3H12"/><path d="M10 1l2 2-2 2"/><path d="M12 7v1.5A2.5 2.5 0 0 1 9.5 11H2"/><path d="M4 9l-2 2 2 2"/></svg></button>
          <span id="elapsed" class="time">0:00</span>
          <input id="seek" class="seek" type="range" min="0" max="0" step="0.1" value="0" data-i18n-aria-label="control.seek">
          <span id="duration" class="time">0:00</span>
          <button id="mute" class="transport-button" type="button" data-name="mute" data-muted="false" data-i18n-title="control.mute" data-i18n-aria-label="control.mute"><svg class="icon-volume" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M1.5 5.2h2.3L7.2 2.4v9.2L3.8 8.8H1.5z" fill="currentColor" stroke="none"/><path d="M9.3 4.9a3 3 0 0 1 0 4.2M11 3.3a5.2 5.2 0 0 1 0 7.4"/></svg><svg class="icon-muted" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M1.5 5.2h2.3L7.2 2.4v9.2L3.8 8.8H1.5z" fill="currentColor" stroke="none"/><path d="M9.5 5.2l3.4 3.6M12.9 5.2L9.5 8.8"/></svg></button>
          <input id="volume" class="volume" type="range" min="0" max="1" step="0.01" value="0.8" data-i18n-aria-label="control.volume">
          <button id="effects-toggle" class="effect-button effects-toggle" type="button" data-name="audio-effects" aria-haspopup="dialog" aria-expanded="false" aria-controls="effects-popover" data-i18n-title="effects.title" data-i18n-aria-label="effects.title"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="1.5" x2="3" y2="12.5"/><line x1="7" y1="1.5" x2="7" y2="12.5"/><line x1="11" y1="1.5" x2="11" y2="12.5"/><rect x="1.5" y="7.5" width="3" height="2" rx="0.5" fill="currentColor"/><rect x="5.5" y="3.5" width="3" height="2" rx="0.5" fill="currentColor"/><rect x="9.5" y="9" width="3" height="2" rx="0.5" fill="currentColor"/></svg></button>
        </div>
      </section>
    </section>
    <dialog id="track-dialog" class="p-dialog"><form id="track-form" method="dialog">
      <h2 id="track-dialog-title"></h2>
      <label><span data-i18n="metadata.title">Title</span><input id="track-title" class="p-input" required></label>
      <label><span data-i18n="metadata.artist">Artist</span><input id="track-artist" class="p-input"></label>
      <label><span data-i18n="metadata.album">Album</span><input id="track-album" class="p-input"></label>
      <label><span data-i18n="metadata.year">Year</span><input id="track-year" class="p-input" type="number" min="0" max="9999"></label>
      <label><span data-i18n="metadata.category">Category</span><input id="track-category" class="p-input" data-name="track-category"></label>
      <div class="form-field"><span id="track-tags-label" data-i18n="metadata.tags">Tags</span><div id="track-tags" class="tags-field" data-name="track-tags"><input id="track-tags-input" class="tags-field-input" aria-labelledby="track-tags-label" data-i18n-placeholder="metadata.tagsHint"></div></div>
      <div class="rating-field"><span id="track-rating-label" data-i18n="metadata.rating">Rating</span><input id="track-rating" type="hidden" value="0"><div id="track-rating-stars" class="rating-stars" role="radiogroup" aria-labelledby="track-rating-label" data-name="track-rating"></div></div>
      <footer><button id="track-cancel" class="p-btn" type="button" data-i18n="control.cancel">Cancel</button><button class="p-btn primary" type="submit" data-i18n="control.save">Save</button></footer>
    </form></dialog>
    <section id="effects-popover" class="effects-popover" role="dialog" aria-labelledby="effects-popover-title" hidden></section>
    <dialog id="catalog-dialog" class="p-dialog" data-name="catalog-dialog"><h2 id="catalog-dialog-title"></h2><p id="catalog-dialog-path" class="catalog-dialog-path"></p><p id="catalog-dialog-needed" data-i18n="catalog.needed" hidden>Tracks are added to a music catalog. Open an existing catalog or create a new one.</p><dl id="catalog-stats" class="catalog-stats"></dl><section id="catalog-folders" class="catalog-folders" data-name="catalog-recent-folders" hidden><h3 data-i18n="folders.recent">Recent import folders</h3><ul id="catalog-folders-list"></ul></section><footer><button id="catalog-dialog-close" class="p-btn" type="button" data-i18n="control.close">Close</button><button id="catalog-dialog-open" class="p-btn" type="button" data-name="catalog-dialog-open" data-i18n="catalog.open">Open catalog</button><button id="catalog-dialog-new" class="p-btn" type="button" data-name="catalog-dialog-new" data-i18n="catalog.new">New catalog</button></footer></dialog>
    <dialog id="import-dialog" class="p-dialog"><h2 data-i18n="folders.import">Add tracks from folder</h2><p id="import-progress" role="status"></p><footer><button id="import-cancel" class="p-btn" type="button" data-i18n="control.cancel">Cancel</button></footer></dialog>
    <dialog id="playlist-import-dialog" class="p-dialog playlist-import-dialog"><h2 data-i18n="playlist.import.title">Import playlist</h2><p id="playlist-import-summary" role="status"></p><p id="playlist-import-error" class="playlist-import-error" role="status"></p><ol id="playlist-preview-list"></ol><footer><button id="playlist-import-cancel" class="p-btn" type="button" data-i18n="control.cancel">Cancel</button><button id="playlist-import-play" class="p-btn" type="button" data-i18n="playlist.import.play">Play now</button><button id="playlist-import-add" class="p-btn primary" type="button" data-i18n="playlist.import.add">Add to catalog</button></footer></dialog>
    <audio id="audio" preload="metadata"></audio><audio id="audio-next" preload="auto"></audio>
  </main>
  <script src="i18n.js"></script>
  <script src="effects/effect-types.js"></script>
  <script src="equalizer.js"></script>
  <script src="crossfade.js"></script>
  <script src="gapless.js"></script>
  <script src="effects/bars.js"></script>
  <script src="effects/circular.js"></script>
  <script src="visualizer.js"></script>
  <script src="catalog.js"></script>
  <script src="catalog-store.js"></script>
  <script src="play-counts.js"></script>
  <script src="smart-playlists.js"></script>
  <script src="playlist-format.js"></script>
  <script src="playlist-queues.js"></script>
  <script src="playlist-import.js"></script>
  <script src="catalog-dialogs.js"></script>
  <script src="catalog-search.js"></script>
  <script src="folder-import.js"></script>
  <script src="lib/board-range-tokenizer.js"></script>
  <script src="lib/music-metadata.js"></script>
  <script src="metadata.js"></script>
  <script src="field-inputs.js"></script>
  <script src="catalog-view.js"></script>
  <script src="source-queue.js"></script>
  <script src="player-settings.js"></script>
  <script src="player.js"></script>
  <script src="ai-vision.js"></script>
  <script src="app.js"></script>
</body>
</html>
